trigger:
  tags:
    include:
    - '*'

pr:
  branches:
    include:
    - '*'
  paths:
    exclude:
    - README.md
    - LICENSE
  drafts: false

resources:
  repositories:
    - repository: ci
      type: github
      # Why do not use GITHUB_CONNECTION variable here? https://developercommunity.visualstudio.com/t/allow-variables-at-resourcesrepositoriesrepository/816606
      endpoint: "DisplayNote through PAT."
      name: DisplayNote/qt-conan-ci
      # 2.5.0 adds the tests + coverage stage (roadmap 2.23). Like 2.4.0 it
      # builds every stage against Qt 6.8.8 LTS by default (AB#141677):
      # msvc2022_64 kit on the agent-pool-windows2022-vmss pool. Nothing is
      # overridden here. Qt 6.5 and 6.8 are not ABI compatible - release under a
      # new package version rather than rebuilding an existing one.
      ref: refs/tags/2.5.0
    # AI Security Roadmap 4.1 — shared secret-scanning (gitleaks) and
    # dependency-scanning (OSV-Scanner + Grype) templates, pinned to an
    # immutable tag like qt-conan-ci above.
    - repository: dn-templates
      type: github
      endpoint: "DisplayNote through PAT."
      name: DisplayNote/dn-pipeline-templates
      ref: refs/tags/v1.1.2

variables:
  - group: montage-client-environment-variables

# Stage order: SecretScan + DependencyScan (in parallel) -> setup (VERSION) ->
# tests_coverage -> build stages -> deploy. Every dependency is explicit.
stages:
    # Both scan stages declare dependsOn: [], so they start together.
    - template: secret-scan-stage.yml@dn-templates

    - template: dependency-scan-stage.yml@dn-templates
      parameters:
        # Temporary: the scan finds no packages here - conan.lock is generated by
        # conaninstall.pri, not committed, and there is no native-deps.toml - and a
        # scan with no packages fails the stage. The one dependency is
        # bonjoursdk/3.0.0 (conanfile.py, Windows only). Remove once it is listed
        # in a native-deps.toml that the gate counts (AB#143382).
        allowNoPackages: true

    - template: common/setup.yml@ci
      parameters:
        dependsOn: [SecretScan, DependencyScan]

    # Roadmap 2.23 — the GoogleTest suite in tests/ under OpenCppCoverage (Windows,
    # Debug). The library is built first from qtbonjour.pro, then the tests link
    # it with a fake dns_sd, so no Bonjour service is needed. blocking: false is
    # audit mode: failing tests and a figure below 75% are warnings; true makes
    # them stop the build and the deploy.
    - template: windows-x86_64/coverage.yml@ci
      parameters:
        enabled: true
        blocking: false
        libraryProjectFile: 'qtbonjour/qtbonjour.pro'
        projectFile: 'qtbonjour/tests/qtbonjourtests.pro'
        testPrograms:
          - name: qtbonjourtests
            program: 'qtbonjourtests.exe'
            framework: gtest
        # The demo app's entry point (qtbonjour_app.pro), not part of the library.
        excludedSources:
          - '\qtbonjour\main.cpp'

    # Windows only. Montage consumes qtbonjour on Windows alone (macOS, iOS and
    # Android use their own mDNS stacks), and every published qtbonjour package
    # has been Windows x86_64.
    - template: windows-x86_64/build.yml@ci
      parameters:
        projectFile: 'qtbonjour/qtbonjour.pro'
        dependsOn: [setup, tests_coverage]

    - template: common/deploy-develop.yml@ci
      parameters:
        conanfile: 'qtbonjour/conanfile.py'
        packageName: 'qtbonjour'
        stageDependencies: ['SecretScan', 'DependencyScan', 'setup', 'tests_coverage', 'windows_x86_64']
        # Still msvc19.* although the stage builds with VS2022: qt-conan-ci keeps
        # the profile names stable on purpose. Must match conaninstall.pri.
        conanProfiles: ['msvc19.x86_64']
